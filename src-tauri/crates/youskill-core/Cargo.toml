[package]
name = "youskill-core"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Skill hub, lock file and drift model shared by the YouSkill app and CLI"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
dirs-next = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "sync", "time"] }
zip = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
similar = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time"] }
